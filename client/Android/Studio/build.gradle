buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url 'https://maven.google.com'
        }
    }
    dependencies {
       classpath 'com.android.tools.build:gradle:9.2.1'
       // M1: Kotlin + KSP (kunci pair: KSP harus match versi Kotlin)
       classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21'
       classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.2.21-2.0.5'
       // M1.2: Compose compiler (versi = versi Kotlin)
       classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.2.21'
       // Push (FCM): plugin hanya diterapkan di :app bila app/google-services.json ada.
       classpath 'com.google.gms:google-services:4.4.2'
    }
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
// NOTE(KzDesk): the 'com.gladed.androidgitversion' plugin from the upstream FreeRDP build is
// intentionally NOT applied here: versionName/versionCode are provided via release.properties
// (see KZDESK-REMOTE-NOTICE.md).
Properties releaseProperties = new Properties()
File file = new File('release.properties')
if (file.canRead()) {
    releaseProperties.load(new FileInputStream(file))
}
ext {
    if (!hasProperty('RELEASE_STORE_FILE')) {
        RELEASE_STORE_FILE=System.getenv('RELEASE_STORE_FILE') ?: releaseProperties.get('RELEASE_STORE_FILE', "${rootDir}/.release-signing-required.keystore")
    }
    if (!hasProperty('RELEASE_KEY_ALIAS')) {
        RELEASE_KEY_ALIAS=System.getenv('RELEASE_KEY_ALIAS') ?: releaseProperties.get('RELEASE_KEY_ALIAS', '')
    }
    if (!hasProperty('RELEASE_KEY_PASSWORD')) {
        RELEASE_KEY_PASSWORD=System.getenv('RELEASE_KEY_PASSWORD') ?: releaseProperties.get('RELEASE_KEY_PASSWORD', '')
    }
    if (!hasProperty('RELEASE_STORE_PASSWORD')) {
        RELEASE_STORE_PASSWORD=System.getenv('RELEASE_STORE_PASSWORD') ?: releaseProperties.get('RELEASE_STORE_PASSWORD', '')
    }

    compileApi = releaseProperties.get('COMPILE_API', 37).toInteger()
    targetApi = releaseProperties.get('TARGET_API', 37).toInteger()
    minApi = releaseProperties.get('MIN_API', 24).toInteger()
    toolsVersion = releaseProperties.get('TOOLS_VERSION', '37.0.0')
    universal = releaseProperties.get('BUILD_UNIVERSAL', true).toBoolean()
    splitArchs = releaseProperties.get('SPLIT_ARCHITECTURES', 'arm64-v8a;x86_64').split(';')
    splitEnabled = releaseProperties.get('SPLIT_ENABLED', true).toBoolean()
    minifyEnabled = releaseProperties.get('MINIFY_ENABLED', true).toBoolean()
    ndkVersion = releaseProperties.get('NDK_VERSION', '29.0.13113456')
    abiFilters = releaseProperties.get('ABI_FILTERS', 'arm64-v8a;x86_64').split(';')
    cmakeArguments = releaseProperties.get('CMAKE_ARGUMENTS', '-DWITH_FFMPEG=ON;-DWITH_OPENH264=ON;-DWITH_OPUS=ON;-DWITH_WEBP=ON;-DWITH_JPEG=ON;-DWITH_PNG=ON;-DWITH_CJSON=ON;-DWITH_OPENSSL=ON').split(';')
    cmakeVersion = releaseProperties.get('CMAKE_VERSION', '4.1.2')
    versionName = releaseProperties.get('VERSION_NAME', '0.1.0')
    versionCode = releaseProperties.get('VERSION_CODE', 1).toInteger()
    println '----------------- Project configuration -------------------'
    println 'RELEASE_STORE_FILE:      ' + RELEASE_STORE_FILE
    println 'VERSION_NAME (override): ' + versionName
    println 'VERSION_CODE (override): ' + versionCode
    println 'COMPILE_API:             ' + compileApi
    println 'TARGET_API:              ' + targetApi
    println 'MIN_API:                 ' + minApi
    println 'TOOLS_VERSION:           ' + toolsVersion
    println 'NDK_VERSION:             ' + ndkVersion
    println 'SPLIT_ENABLED:           ' + splitEnabled
    println 'BUILD_UNIVERSAL:         ' + universal
    println 'SPLIT_ARCHITECTURES:     ' + splitArchs
    println 'ABI_FILTERS:             ' + abiFilters
    println 'CMAKE_VERSION:           ' + cmakeVersion
    println 'CMAKE_ARGUMENTS:         ' + cmakeArguments
    println '-----------------------------------------------------------'
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven {
            url 'https://maven.google.com'
        }
    }

    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace 'com.freerdp.' + project.name.toLowerCase()
                    }
                }
            }
        }
    }
}
