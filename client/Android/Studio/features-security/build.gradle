// =============================================================
// :features-security — M1: credential vault (Android Keystore)
// Password RDP tidak pernah plaintext di disk (PLAN §5.2).
// Tanpa dependensi Tink: AndroidKeyStore AES-256-GCM langsung.
// =============================================================
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.kazamatech.kzdesk.security'
    compileSdkVersion rootProject.ext.compileApi
    buildToolsVersion rootProject.ext.toolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minApi
        targetSdkVersion rootProject.ext.targetApi
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

// Tidak ada dependensi eksternal — semua dari SDK (keystore, javax.crypto)
