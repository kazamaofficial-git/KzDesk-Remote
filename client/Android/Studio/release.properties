# KzDesk Remote — build configuration (consumed by build.gradle)
#
# Per-ABI splits: TIDAK ada APK universal gabungan (keputusan produk).
# Minify/R8: aktif di RELEASE (knob MINIFY_ENABLED untuk rollback cepat).

COMPILE_API=37
TARGET_API=37
MIN_API=24
TOOLS_VERSION=37.0.0
NDK_VERSION=29.0.13113456
CMAKE_VERSION=4.1.2

ABI_FILTERS=armeabi-v7a;arm64-v8a;x86_64
SPLIT_ARCHITECTURES=armeabi-v7a;arm64-v8a;x86_64
SPLIT_ENABLED=true
BUILD_UNIVERSAL=false
MINIFY_ENABLED=true

VERSION_NAME=1.0.0
VERSION_CODE=10000

# FreeRDP superbuild options (see client/Android/cmake/ExternalDeps.cmake)
CMAKE_ARGUMENTS=-DWITH_FFMPEG=ON;-DWITH_OPENH264=ON;-DWITH_OPUS=ON;-DWITH_WEBP=ON;-DWITH_JPEG=ON;-DWITH_PNG=ON;-DWITH_CJSON=ON;-DWITH_OPENSSL=ON
