name: Build & Release

# Setiap kali workflow ini dijalankan, semua platform dibangun lalu dipublikasikan ke
# GitHub Release "v<VERSION_NAME>" (versi dibaca dari client/Android/Studio/release.properties).
# Aset yang sudah ada di rilis yang sama ditimpa. Server kzdesk-web membaca rilis ini untuk auto-update.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: kzdesk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ versi
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION="$(sed -n 's/^VERSION_NAME=//p' client/Android/Studio/release.properties | tr -d '\r')"
          CODE="$(sed -n 's/^VERSION_CODE=//p' client/Android/Studio/release.properties | tr -d '\r')"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::VERSION_NAME tidak valid: $VERSION"; exit 1; }
          EXPECTED=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          if [ "$CODE" != "$EXPECTED" ]; then
            echo "::error::VERSION_CODE ($CODE) harus major*10000+minor*100+patch = $EXPECTED agar auto-update benar."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------ tes ringan
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Tes server web (Node)
        run: cd kzdesk-web && node --test test/*.test.js
      - name: Validasi contoh Template Controller
        run: python3 scripts/validate_templates.py templates/*.json

  # --------------------------------------------------------------- Android
  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RELEASE_STORE_FILE: ${{ runner.temp }}/kzdesk-release.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Keystore penandatangan
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi. Auto-update Android butuh tanda tangan yang SAMA di setiap rilis."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RELEASE_STORE_FILE"
      - name: Konfigurasi Firebase (opsional, untuk push)
        env:
          GSJ_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ_B64" ]; then echo "$GSJ_B64" | base64 -d > client/Android/Studio/app/google-services.json; else echo "google-services.json tidak ada: push dinonaktifkan di build ini."; fi
      - name: Komponen Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.13113456" "cmake;4.1.2"
      - name: Build APK release (per-ABI)
        working-directory: client/Android/Studio
        run: ./gradlew --no-daemon assembleRelease
      - name: Unit test (tidak memblokir rilis)
        continue-on-error: true
        working-directory: client/Android/Studio
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Kumpulkan & periksa APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="$(find client/Android/Studio/app/build/outputs/apk/release -name "*${abi}*.apk" | head -1)"
            [ -n "$f" ] && cp "$f" "dist/KzDesk-Remote-${abi}.apk"
          done
          ls -l dist
          [ -n "$(ls dist)" ] || { echo "::error::Tidak ada APK yang dihasilkan."; exit 1; }
          python3 ci/verify_android_apks.py dist/*.apk
          AAPT2="$(ls $ANDROID_HOME/build-tools/37.0.0/aapt2)"
          for apk in dist/*.apk; do
            "$AAPT2" dump badging "$apk" | grep -E "package: name='com.kazamatech.kzdesk' .*versionName='$VERSION'" \
              || { echo "::error::$apk: package/versi tidak sesuai ($VERSION)"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kz-android
          path: dist/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------- iOS
  ios:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build (tanpa tanda tangan)
        run: |
          cmake -S client/iOS -B build/ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/ios.toolchain.cmake" -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""
          cmake --build build/ios --config Release -- -quiet
      - name: Bungkus IPA
        run: |
          APP="$(find build/ios -name 'KzDeskRemote.app' -type d | head -1)"
          [ -n "$APP" ] || { echo "::error::KzDeskRemote.app tidak ditemukan"; exit 1; }
          rm -rf Payload dist && mkdir -p Payload dist
          cp -R "$APP" Payload/
          zip -qry dist/KzDesk-Remote-ios.ipa Payload
          ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: kz-ios, path: dist/KzDesk-Remote-ios.ipa, if-no-files-found: error }

  # ------------------------------------------------- Windows: KzDesk Host
  host-windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Bangun installer Host
        shell: pwsh
        env:
          KZ_API_BASE: ${{ vars.KZ_API_BASE }}
        run: ./host-agent/windows/build-host.ps1 -Version "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with: { name: kz-host-windows, path: dist/KzDesk-Host-Setup.exe, if-no-files-found: error }

  # ------------------------------- Desktop (RDP client SDL) Linux/macOS/Windows
  desktop-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev libx11-dev libxext-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxinerama-dev libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libusb-1.0-0-dev libcairo2-dev libcjson-dev libfuse3-dev
      - name: SDL3
        run: |
          git clone --depth 1 --branch release-3.2.10 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/sdl-prefix
          cmake --build /tmp/SDL/build && cmake --install /tmp/SDL/build
      - name: Build klien desktop
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/tmp/sdl-prefix \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage/kzdesk" -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' \
            -DWITH_CLIENT_SDL=ON -DWITH_X11=ON -DWITH_SERVER=OFF -DWITH_SAMPLE=OFF -DWITH_MANPAGES=OFF -DBUILD_TESTING=OFF
          cmake --build build/desktop && cmake --install build/desktop
      - name: Paket
        run: |
          mkdir -p dist
          cp scripts/desktop/kzdesk-connect.sh stage/kzdesk/bin/ && chmod +x stage/kzdesk/bin/kzdesk-connect.sh
          cp /tmp/sdl-prefix/lib/libSDL3.so* stage/kzdesk/lib/ 2>/dev/null || true
          tar -C stage -czf dist/KzDesk-Desktop-linux-x86_64.tar.gz kzdesk
      - uses: actions/upload-artifact@v4
        with: { name: kz-desktop-linux, path: dist/*.tar.gz, if-no-files-found: error }

  desktop-macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependensi
        run: brew install cmake ninja pkg-config openssl@3 cjson
      - name: SDL3
        run: |
          git clone --depth 1 --branch release-3.2.10 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/sdl-prefix
          cmake --build /tmp/SDL/build && cmake --install /tmp/SDL/build
      - name: Build klien desktop
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/tmp/sdl-prefix;$(brew --prefix openssl@3)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage/kzdesk" -DCMAKE_INSTALL_RPATH='@loader_path/../lib' \
            -DWITH_CLIENT_SDL=ON -DWITH_SERVER=OFF -DWITH_SAMPLE=OFF -DWITH_MANPAGES=OFF -DBUILD_TESTING=OFF
          cmake --build build/desktop && cmake --install build/desktop
      - name: Paket
        run: |
          mkdir -p dist
          cp scripts/desktop/kzdesk-connect.sh stage/kzdesk/bin/ && chmod +x stage/kzdesk/bin/kzdesk-connect.sh
          cp /tmp/sdl-prefix/lib/libSDL3*.dylib stage/kzdesk/lib/ 2>/dev/null || true
          (cd stage && zip -qry ../dist/KzDesk-Desktop-macos-arm64.zip kzdesk)
      - uses: actions/upload-artifact@v4
        with: { name: kz-desktop-macos, path: dist/*.zip, if-no-files-found: error }

  desktop-windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependensi (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows sdl3:x64-windows cjson:x64-windows
      - name: Build klien desktop
        shell: pwsh
        run: |
          cmake -S . -B build/desktop -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_INSTALL_PREFIX="$PWD\stage\kzdesk" -DWITH_CLIENT_SDL=ON -DWITH_SERVER=OFF -DWITH_SAMPLE=OFF -DWITH_MANPAGES=OFF -DBUILD_TESTING=OFF
          cmake --build build/desktop --config Release
          cmake --install build/desktop --config Release
      - name: Paket
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item scripts/desktop/kzdesk-connect.ps1, scripts/desktop/kzdesk-connect.cmd stage/kzdesk/bin/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" stage/kzdesk/bin/ -ErrorAction SilentlyContinue
          Compress-Archive -Path stage/kzdesk -DestinationPath dist/KzDesk-Desktop-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with: { name: kz-desktop-windows, path: dist/*.zip, if-no-files-found: error }

  # --------------------------------------------------------------- Rilis
  publish:
    needs: [prepare, checks, android, ios, host-windows, desktop-linux, desktop-macos, desktop-windows]
    # Publikasikan selama Android + tes lulus; platform lain yang gagal dilewati dan tercatat di catatan rilis.
    if: ${{ always() && needs.prepare.result == 'success' && needs.checks.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kz-*
          merge-multiple: true
          path: dist
      - name: Checksum SHA-256
        working-directory: dist
        run: |
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Catatan rilis
        env:
          R_ANDROID: ${{ needs.android.result }}
          R_IOS: ${{ needs.ios.result }}
          R_HOST: ${{ needs.host-windows.result }}
          R_LINUX: ${{ needs.desktop-linux.result }}
          R_MAC: ${{ needs.desktop-macos.result }}
          R_WIN: ${{ needs.desktop-windows.result }}
        run: |
          mark() { [ "$1" = "success" ] && echo "tersedia" || echo "tidak dibangun pada run ini ($1)"; }
          {
            echo "## KzDesk Remote $TAG"
            echo
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
            echo
            echo "### Unduhan"
            echo "| Platform | Berkas | Status |"
            echo "|---|---|---|"
            echo "| Android | \`KzDesk-Remote-<abi>.apk\` | $(mark "$R_ANDROID") |"
            echo "| iOS | \`KzDesk-Remote-ios.ipa\` (tanpa tanda tangan) | $(mark "$R_IOS") |"
            echo "| Windows (Host) | \`KzDesk-Host-Setup.exe\` | $(mark "$R_HOST") |"
            echo "| Windows (Desktop) | \`KzDesk-Desktop-windows-x64.zip\` | $(mark "$R_WIN") |"
            echo "| macOS | \`KzDesk-Desktop-macos-arm64.zip\` | $(mark "$R_MAC") |"
            echo "| Linux | \`KzDesk-Desktop-linux-x86_64.tar.gz\` | $(mark "$R_LINUX") |"
            echo
            echo "Verifikasi berkas dengan \`SHA256SUMS.txt\`."
          } > notes.md
      - name: Publikasikan ke GitHub Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "KzDesk Remote $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "KzDesk Remote $TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
          gh release upload "$TAG" dist/* --clobber
